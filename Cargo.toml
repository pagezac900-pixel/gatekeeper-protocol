[package]
name = "gatekeeper-sdk"
version = "0.1.0"
edition = "2021"
description = "Cryptographically-enforced human authorization for AI systems"
license = "MIT"
authors = ["Vertexpace"]

[[bin]]
name = "gatekeeper"
path = "src/bin/gatekeeper.rs"

[lib]
name = "gatekeeper_sdk"
path = "src/lib.rs"

[features]
test-helpers = []

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
blake3 = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
